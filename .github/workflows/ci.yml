name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test
        env:
          API_GATEWAY_URL: 'http://127.0.0.1:8443'
          API_GATEWAY_KEY: 'test_ci_gateway_key'
          MEMBER_SESSION_SECRET: 'test-secret-at-least-32-chars-long-for-ci-build'
          COOKIE_SECURE: 'false'
          S3_ENDPOINT: 'http://127.0.0.1:9000'
          S3_ACCESS_KEY: 'test_minio_access'
          S3_SECRET_KEY: 'test_minio_secret'

      - name: Cache Next.js Build (.next/cache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        run: npm run build
        env:
          API_GATEWAY_URL: 'http://127.0.0.1:8443'
          API_GATEWAY_KEY: 'test_ci_gateway_key'
          MEMBER_SESSION_SECRET: 'test-secret-at-least-32-chars-long-for-ci-build'
          COOKIE_SECURE: 'false'
          S3_ENDPOINT: 'http://127.0.0.1:9000'
          S3_ACCESS_KEY: 'test_minio_access'
          S3_SECRET_KEY: 'test_minio_secret'
