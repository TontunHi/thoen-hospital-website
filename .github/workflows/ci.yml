name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: 'mysql://fake:fake@localhost:3306/fake'
          MEMBER_SESSION_SECRET: 'test-secret-at-least-32-chars-long-for-ci-build'
          COOKIE_SECURE: 'false'
