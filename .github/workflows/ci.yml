name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: 'mysql://fake:fake@localhost:3306/fake'
          MEMBER_SESSION_SECRET: 'test-secret-at-least-32-chars-long-for-ci-build'
          COOKIE_SECURE: 'false'

  backend:
    name: Go Backend (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee /tmp/go-test.log

      - name: Annotate test failures
        if: failure()
        run: |
          [ -f /tmp/go-test.log ] || exit 0
          msg=$(grep -E -A6 -- '^\s*--- FAIL|^FAIL|^panic:|\.go:[0-9]+:' /tmp/go-test.log | head -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Go test failures::$msg"

      - name: Build (linux and windows)
        run: |
          go build ./...
          GOOS=windows GOARCH=amd64 go build -o /tmp/thoen-backend.exe ./cmd/server

      - name: Smoke test the binary
        run: |
          go build -o /tmp/thoen-backend ./cmd/server
          ./scripts/smoke.sh /tmp/thoen-backend
