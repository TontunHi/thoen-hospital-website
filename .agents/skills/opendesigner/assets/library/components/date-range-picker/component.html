<script>
document.querySelectorAll(".odl-date-range-picker").forEach((root) => {
  if (root.dataset.odlReady) return; root.dataset.odlReady = "1";
  const TODAY = new Date(2026, 10, 12);
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const short = (d) => `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`;
  const months = [...root.querySelectorAll(".odl-month")], presets = [...root.querySelectorAll("[data-preset]")];
  const startOut = root.querySelector(".odl-start"), endOut = root.querySelector(".odl-end"), summary = root.querySelector(".odl-summary");
  const initial = { start: new Date(2026, 9, 27), end: new Date(2026, 10, 9), view: new Date(2026, 9, 1), preset: "custom" };
  let state = { ...initial };
  const render = () => {
    const s = state.start && iso(state.start), e = state.end && iso(state.end);
    months.forEach((sec, i) => {
      const first = new Date(state.view.getFullYear(), state.view.getMonth() + i, 1), grid = sec.querySelector(".odl-grid");
      sec.querySelector("h3").textContent = `${MONTHS[first.getMonth()]} ${first.getFullYear()}`;
      const cells = [];
      for (let p = 0; p < first.getDay(); p++) { const pad = document.createElement("span"); pad.className = "odl-pad"; cells.push(pad); }
      for (let d = new Date(first); d.getMonth() === first.getMonth(); d.setDate(d.getDate() + 1)) {
        const k = iso(d), b = document.createElement("button"), n = document.createElement("span");
        b.type = "button"; b.dataset.date = k; n.textContent = d.getDate(); b.append(n);
        b.setAttribute("aria-label", `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`);
        b.className = "odl-day";
        if (k === s) b.classList.add("is-start");
        if (k === e) b.classList.add("is-end");
        if (s && e) { b.classList.add("has-start", "has-end"); if (k > s && k < e) b.classList.add("is-range"); }
        if (k === iso(TODAY)) { b.classList.add("is-today"); b.setAttribute("aria-current", "date"); }
        b.setAttribute("aria-pressed", k === s || k === e ? "true" : "false");
        b.disabled = d > TODAY;
        cells.push(b);
      }
      grid.replaceChildren(...cells);
      sec.querySelector(".is-prev").disabled = false;
      sec.querySelector(".is-next").disabled = new Date(first.getFullYear(), first.getMonth() + 1, 1) > TODAY;
    });
    startOut.textContent = state.start ? short(state.start) : "Pick a day";
    endOut.textContent = state.end ? short(state.end) : "Pick a day";
    startOut.classList.toggle("is-empty", !state.start); endOut.classList.toggle("is-empty", !state.end);
    startOut.parentElement.classList.toggle("is-active", !state.start);
    endOut.parentElement.classList.toggle("is-active", !!state.start && !state.end);
    presets.forEach((p) => p.setAttribute("aria-pressed", p.dataset.preset === state.preset ? "true" : "false"));
    const strong = document.createElement("strong");
    if (state.start && state.end) {
      const n = Math.round((state.end - state.start) / 864e5) + 1;
      strong.textContent = n === 1 ? "1 day" : `${n} days`;
      summary.replaceChildren(strong, " · in your workspace time, UTC−5");
    } else { strong.textContent = "Pick an end day"; summary.replaceChildren(strong, " · or click the start day again for one day"); }
  };
  const show = (end) => { state.view = new Date(end.getFullYear(), end.getMonth() - 1, 1); };
  root.addEventListener("click", (ev) => {
    const day = ev.target.closest(".odl-day"), nav = ev.target.closest(".odl-nav"), pre = ev.target.closest("[data-preset]");
    if (day && !day.disabled) {
      const [y, m, d] = day.dataset.date.split("-").map(Number), picked = new Date(y, m - 1, d);
      if (!state.start || state.end) { state.start = picked; state.end = null; }
      else if (picked < state.start) { state.end = state.start; state.start = picked; }
      else state.end = picked;
      state.preset = "custom"; render();
      const again = root.querySelector(`.odl-day[data-date="${day.dataset.date}"]`); if (again) again.focus();
    } else if (nav && !nav.disabled) {
      state.view = new Date(state.view.getFullYear(), state.view.getMonth() + (nav.classList.contains("is-next") ? 1 : -1), 1); render();
    } else if (pre) {
      const t = TODAY, p = pre.dataset.preset;
      if (p === "today") { state.start = new Date(t); state.end = new Date(t); }
      if (p === "7") { state.start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 6); state.end = new Date(t); }
      if (p === "month") { state.start = new Date(t.getFullYear(), t.getMonth(), 1); state.end = new Date(t); }
      if (p === "quarter") { const q = Math.floor(t.getMonth() / 3) * 3; state.start = new Date(t.getFullYear(), q - 3, 1); state.end = new Date(t.getFullYear(), q, 0); }
      state.preset = p; if (state.end) show(state.end); render();
    } else if (ev.target.closest(".odl-cancel")) { state = { ...initial }; render(); }
  });
  render();
});
</script>
