<script>
document.querySelectorAll(".odl-product-gallery").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const track = root.querySelector(".odl-track"), dots = [...root.querySelectorAll(".odl-dot")], thumbs = [...root.querySelectorAll(".odl-thumb")];
  const mark = (i) => { [dots, thumbs].forEach((set) => set.forEach((b, j) => b.setAttribute("aria-current", String(i === j)))); track.setAttribute("aria-label", `Photos, ${i + 1} of ${dots.length}`); };
  const go = (i) => { track.scrollTo({ left: i * track.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); mark(i); };
  [dots, thumbs].forEach((set) => set.forEach((b, i) => b.addEventListener("click", () => go(i))));
  let t; track.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => mark(Math.round(track.scrollLeft / track.clientWidth)), 60); });
  track.addEventListener("keydown", (e) => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (e.key === "ArrowRight") { e.preventDefault(); go(Math.min(i + 1, dots.length - 1)); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(Math.max(i - 1, 0)); }
  });
  const add = root.querySelector(".odl-add"), label = root.querySelector(".odl-add-label"), live = root.querySelector("[aria-live]");
  add.addEventListener("click", () => {
    const c = root.querySelector('.odl-colour input:checked').getAttribute("aria-label"), s = root.querySelector('.odl-size-set input:checked').value;
    add.classList.add("is-added"); label.textContent = "Added to bag"; live.textContent = `Added to bag: ${c}, size ${s}`;
    setTimeout(() => { add.classList.remove("is-added"); label.textContent = "Add to bag"; }, 2200);
  });
  root.querySelector(".odl-fav").addEventListener("click", (e) => {
    const b = e.currentTarget, on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", on ? "Saved to wishlist" : "Save to wishlist");
  });
});
</script>
