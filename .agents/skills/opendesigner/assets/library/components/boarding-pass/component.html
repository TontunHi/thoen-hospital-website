<style>
.odl-boarding-pass { box-sizing: border-box; inline-size: 100%; max-inline-size: 24rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); }
.odl-boarding-pass *, .odl-boarding-pass *::before, .odl-boarding-pass *::after { box-sizing: border-box; }

.odl-boarding-pass .odl-face, .odl-boarding-pass .odl-stub { position: relative; }
.odl-boarding-pass .odl-face { display: grid; gap: var(--ds-space-stack-lg); padding: var(--ds-space-inset-xl); color: var(--ds-color-text-inverse);
  background: var(--ds-color-bg-inverse);
  border-radius: var(--ds-radius-container) var(--ds-radius-container) 0 0;
  -webkit-mask: radial-gradient(circle at 0 100%, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) left / 51% 100% no-repeat, radial-gradient(circle at 100% 100%, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) right / 51% 100% no-repeat;
  mask: radial-gradient(circle at 0 100%, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) left / 51% 100% no-repeat, radial-gradient(circle at 100% 100%, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) right / 51% 100% no-repeat; }
.odl-boarding-pass .odl-stub { display: grid; gap: var(--ds-space-stack-lg); padding: var(--ds-space-inset-xl); background: var(--ds-color-surface-raised);
  border-radius: 0 0 var(--ds-radius-container) var(--ds-radius-container);
  -webkit-mask: radial-gradient(circle at 0 0, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) left / 51% 100% no-repeat, radial-gradient(circle at 100% 0, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) right / 51% 100% no-repeat;
  mask: radial-gradient(circle at 0 0, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) left / 51% 100% no-repeat, radial-gradient(circle at 100% 0, transparent var(--notch), var(--ds-color-black) calc(var(--notch) + 0.5px)) right / 51% 100% no-repeat; }
.odl-boarding-pass .odl-tear { position: absolute; inset-inline: calc(var(--notch) + var(--ds-space-8)); inset-block-start: 0; block-size: var(--ds-border-width-emphasis); transform: translateY(-50%);

.odl-boarding-pass .odl-top { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-inline-sm); }
.odl-boarding-pass .odl-brand { display: flex; align-items: center; gap: var(--ds-space-inline-sm); font: var(--ds-text-label-lg); }
.odl-boarding-pass .odl-mark { display: grid; place-items: center; inline-size: var(--ds-size-control-sm); block-size: var(--ds-size-control-sm); border-radius: var(--ds-radius-nested); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); }
.odl-boarding-pass .odl-mark svg { inline-size: 70%; block-size: 70%; }
.odl-boarding-pass .odl-flightno { display: grid; gap: var(--ds-space-2); text-align: end; font: var(--ds-text-label-md); opacity: 0.8; font-variant-numeric: tabular-nums; }
.odl-boarding-pass .odl-route { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: var(--ds-space-inline-sm); }
.odl-boarding-pass .odl-city { display: grid; gap: var(--ds-space-stack-xs); margin: 0; }
.odl-boarding-pass .odl-city:last-child { text-align: end; }
.odl-boarding-pass .odl-iata { font: var(--ds-text-headline-sm); letter-spacing: var(--ds-text-headline-sm-tracking); line-height: 1.05; }
.odl-boarding-pass .odl-name { font: var(--ds-text-label-md); opacity: 0.8; white-space: nowrap; }
.odl-boarding-pass .odl-fly { position: relative; display: grid; place-items: center; block-size: var(--ds-size-control-sm); margin-block-end: var(--ds-space-stack-md); }
.odl-boarding-pass .odl-fly::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 50%; block-size: var(--ds-border-width-emphasis);

.odl-boarding-pass .odl-fly span { position: absolute; inset-block-start: 100%; font: var(--ds-text-label-sm); opacity: 0.8; white-space: nowrap; font-variant-numeric: tabular-nums; }
.odl-boarding-pass .odl-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ds-space-stack-md) var(--ds-space-inline-md); margin: 0; }
.odl-boarding-pass .odl-facts div { display: grid; gap: var(--ds-space-stack-xs); min-inline-size: 0; }

.odl-boarding-pass .odl-who { display: flex; justify-content: space-between; align-items: start; gap: var(--ds-space-inline-md); }
.odl-boarding-pass .odl-who p { margin: 0; display: grid; gap: var(--ds-space-stack-xs); }

.odl-boarding-pass .odl-who strong { font: var(--ds-text-title-sm); }
.odl-boarding-pass .odl-who p:last-child { text-align: end; }
.odl-boarding-pass .odl-status { display: inline-flex; align-items: center; gap: var(--ds-space-inline-xs); justify-self: start; padding: var(--ds-space-inset-xs) var(--ds-space-inset-sm); border-radius: var(--ds-radius-control-sm);

.odl-boarding-pass .odl-status::before { content: ""; inline-size: var(--ds-space-6); block-size: var(--ds-space-6); border-radius: var(--ds-radius-full); background: currentColor; }
.odl-boarding-pass .odl-code { display: grid; gap: var(--ds-space-stack-sm); justify-items: center; padding: var(--ds-space-inset-md); border-radius: var(--ds-radius-nested); background: var(--ds-color-white);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-boarding-pass .odl-code svg { display: block; inline-size: 100%; block-size: calc(var(--ds-size-control-lg) * 1.4); }
.odl-boarding-pass .odl-code rect { fill: var(--ds-color-neutral-light-12); }
.odl-boarding-pass .odl-code span { color: var(--ds-color-neutral-light-11); font: var(--ds-text-code-sm); letter-spacing: var(--ds-text-label-sm-tracking); }
.odl-boarding-pass .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@container (max-width: 21rem) {
  .odl-boarding-pass .odl-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .odl-boarding-pass .odl-face, .odl-boarding-pass .odl-stub { padding-inline: var(--ds-space-inset-lg); }
}
</style>
