<script>
document.querySelectorAll(".odl-stay-card").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const track = root.querySelector(".odl-track"), dots = root.querySelectorAll(".odl-dots i");
  const prev = root.querySelector(".odl-prev"), next = root.querySelector(".odl-next"), n = dots.length;
  const at = () => Math.round(track.scrollLeft / track.clientWidth);
  const show = () => {
    const i = Math.min(n - 1, Math.max(0, at()));
    dots.forEach((d, k) => d.classList.toggle("is-on", k === i));
    prev.disabled = i === 0; next.disabled = i === n - 1;
    track.setAttribute("aria-label", `Photos, ${i + 1} of ${n}`);
  };
  const smooth = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
  const go = (d) => track.scrollTo({ left: (at() + d) * track.clientWidth, behavior: smooth() });
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  track.addEventListener("scroll", show, { passive: true });
  root.querySelector(".odl-fav").addEventListener("click", (e) => {
    const b = e.currentTarget, on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", on ? "Saved to favourites" : "Save to favourites");
  });
  show();
});
</script>
