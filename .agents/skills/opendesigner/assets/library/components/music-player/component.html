  const card = root.querySelector(".odl-card"), seek = root.querySelector(".odl-seek input"), now = root.querySelector(".odl-now");
  const play = root.querySelector(".odl-play"), vol = root.querySelector(".odl-volume input");
  const total = Number(seek.max), clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  let timer = null;
  const show = () => {
    const s = Number(seek.value);
    card.style.setProperty("--p", (s / total) * 100 + "%");
    now.textContent = clock(s);
    seek.setAttribute("aria-valuetext", `${clock(s)} of ${clock(total)}`);
  };
  const stop = () => { clearInterval(timer); timer = null; play.classList.remove("is-playing"); play.setAttribute("aria-label", "Play"); };
  play.addEventListener("click", () => {
    if (timer) return stop();
    if (Number(seek.value) >= total) seek.value = 0;
    play.classList.add("is-playing"); play.setAttribute("aria-label", "Pause");
    timer = setInterval(() => { seek.value = Number(seek.value) + 1; show(); if (Number(seek.value) >= total) stop(); }, 1000);
    show();
  });
  root.querySelector(".odl-prev").addEventListener("click", () => { seek.value = 0; show(); });
  seek.addEventListener("input", show);
  const level = () => vol.style.setProperty("--v", vol.value + "%");
  vol.addEventListener("input", level);
  root.querySelector(".odl-like").addEventListener("click", (e) => {
    const b = e.currentTarget; b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
  });
  show(); level();
});
</script>
