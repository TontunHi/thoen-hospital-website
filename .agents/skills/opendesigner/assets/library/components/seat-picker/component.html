<script>
document.querySelectorAll(".odl-seat-picker").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const seats = [...root.querySelectorAll(".odl-seat input")], what = root.querySelector(".odl-what"), total = root.querySelector(".odl-total"), go = root.querySelector(".odl-go");
  const max = 8;
  const sync = () => {
    const picked = seats.filter((s) => s.checked);
    const sum = picked.reduce((t, s) => t + Number(s.dataset.price), 0);
    what.textContent = picked.length ? `${picked.length} seat${picked.length > 1 ? "s" : ""} · ${picked.map((s) => s.value).join(", ")}` : "Pick up to 8 seats";
    total.textContent = `$${sum.toFixed(2)}`;
    go.disabled = !picked.length;
    seats.forEach((s) => { if (!s.checked && !s.hasAttribute("disabled")) s.toggleAttribute("aria-disabled", picked.length >= max); });
  };
  seats.forEach((s) => s.addEventListener("change", () => {
    if (s.checked && seats.filter((x) => x.checked).length > max) s.checked = false;
    sync();
  }));
  sync();
});
</script>
