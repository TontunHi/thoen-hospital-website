<style>
.odl-toast-stack { box-sizing: border-box; inline-size: 100%; max-inline-size: 26rem; margin: 0 auto; container-type: inline-size; padding: 0; list-style: none; display: grid; gap: max(var(--ds-component-toast-gap), var(--ds-space-stack-sm));
  font: var(--ds-text-body-md); text-wrap: pretty; }

  padding: var(--ds-space-inset-md) var(--ds-space-inset-sm) var(--ds-space-inset-md) var(--ds-space-inset-lg);
  background: var(--ds-color-surface-overlay); color: var(--ds-color-text-primary); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container);
  box-shadow: var(--ds-elevation-floating); animation: odl-toast-in var(--ds-motion-duration-toast) var(--ds-motion-easing-toast) both; }
.odl-toast-stack li:nth-child(2) { animation-delay: var(--ds-motion-duration-stagger); }
.odl-toast-stack li:nth-child(3) { animation-delay: calc(2 * var(--ds-motion-duration-stagger)); }
@keyframes odl-toast-in { from { opacity: 0; transform: translateY(var(--ds-space-8)) scale(var(--ds-motion-scale-enter)); } }
.odl-toast-stack .odl-icon { inline-size: var(--ds-size-icon-md); block-size: var(--ds-size-icon-md); margin-block-start: calc((1lh - var(--ds-size-icon-md)) / 2); }
.odl-toast-stack .is-ok .odl-icon { color: var(--ds-color-text-success); }
.odl-toast-stack .is-error .odl-icon { color: var(--ds-color-text-danger); }
.odl-toast-stack .is-busy .odl-icon { color: var(--ds-color-icon-subtle); }
.odl-toast-stack p { display: grid; gap: var(--ds-space-stack-xs); margin: 0; min-inline-size: 0; font-weight: var(--ds-font-weight-label); }
.odl-toast-stack p small { color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); font-variant-numeric: tabular-nums; }
.odl-toast-stack .odl-progress { display: block; block-size: var(--ds-space-4); margin-block-start: var(--ds-space-stack-xs); border-radius: var(--ds-radius-full); background: var(--ds-color-bg-neutral-subtle); overflow: hidden; }
.odl-toast-stack .odl-progress::before { content: ""; display: block; inline-size: 62%; block-size: 100%; border-radius: inherit; background: var(--ds-color-bg-action-primary); }
.odl-toast-stack .odl-acts { display: flex; align-items: center; gap: var(--ds-space-2); margin-block: calc((1lh - max(var(--ds-size-control-sm), var(--ds-size-target-min))) / 2) 0; }
.odl-toast-stack button { display: inline-grid; place-items: center; min-inline-size: max(var(--ds-size-control-sm), var(--ds-size-target-min)); min-block-size: max(var(--ds-size-control-sm), var(--ds-size-target-min)); padding: 0 var(--ds-space-inset-sm);
  border: 0; border-radius: var(--ds-radius-control); background: transparent; color: var(--ds-color-text-secondary); font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-hover); }
.odl-toast-stack button:hover { background: var(--ds-color-bg-neutral-subtle); color: var(--ds-color-text-primary); }
.odl-toast-stack .odl-act { color: var(--ds-color-text-primary); }
.odl-toast-stack .odl-close { padding: 0; color: var(--ds-color-icon-subtle); }
.odl-toast-stack button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
.odl-toast-stack button svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
@container (max-width: 24rem) {
  .odl-toast-stack li { grid-template-columns: var(--ds-size-icon-md) minmax(0, 1fr); padding-inline-end: var(--ds-space-inset-lg); }
  .odl-toast-stack .odl-acts { grid-column: 2; margin-block-start: var(--ds-space-stack-xs); margin-inline-start: calc(-1 * var(--ds-space-inset-sm)); }
  .odl-toast-stack .odl-close { margin-inline-start: auto; }

@media (prefers-reduced-motion: reduce) { .odl-toast-stack, .odl-toast-stack *, .odl-toast-stack *::before { transition: none !important; animation: none !important; } }
</style>
<ol class="odl-toast-stack" aria-label="Notifications">
  <li class="is-ok" role="status">
    <svg class="odl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    <p>Moved 3 receipts to credit<small>Quenwick Mutual · $21,162.82</small></p>
    <span class="odl-acts"><button type="button" class="odl-act">Undo</button><button type="button" class="odl-close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
  </li>
  <li class="is-busy" role="status">
    <svg class="odl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
    <p>Uploading statement.pdf<small>2.1 of 3.4 MB</small><span class="odl-progress" aria-hidden="true"></span></p>
    <span class="odl-acts"><button type="button" class="odl-act">Cancel</button></span>
  </li>
  <li class="is-error" role="alert">
    <svg class="odl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <p>Couldn’t send the reminder<small>The mail server didn’t answer. Your text is saved.</small></p>
    <span class="odl-acts"><button type="button" class="odl-act">Retry</button><button type="button" class="odl-close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
  </li>
</ol>
<script>
document.querySelectorAll(".odl-toast-stack").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  root.addEventListener("click", (e) => {
    const b = e.target.closest(".odl-close");
    if (!b) return;
    const li = b.closest("li"), next = li.nextElementSibling || li.previousElementSibling;
    li.remove();
    if (next) next.querySelector("button").focus(); // keep keyboard focus nearby
  });
});
</script>
