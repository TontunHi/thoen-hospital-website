<script>
document.querySelectorAll(".odl-article-card").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const save = root.querySelector(".odl-save");
  save.addEventListener("click", () => save.setAttribute("aria-pressed", save.getAttribute("aria-pressed") === "true" ? "false" : "true"));
});
</script>
