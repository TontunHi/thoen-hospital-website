<script>
document.querySelectorAll(".odl-home-controls").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const tiles = root.querySelectorAll(".odl-tile"), count = root.querySelector(".odl-count");
  const tally = () => { const n = [...tiles].filter((t) => t.classList.contains("is-on")).length;
    count.textContent = `${n} active`; };
  root.querySelectorAll(".odl-rooms input").forEach((r) => r.addEventListener("change", () => {
    tiles.forEach((t) => { t.hidden = r.value !== "all" && t.dataset.room !== r.value; });
  }));
  root.querySelectorAll(".odl-toggle").forEach((b) => b.addEventListener("click", () => {
    const tile = b.closest(".odl-tile"), on = b.getAttribute("aria-pressed") !== "true", slider = tile.querySelector(".odl-slider input");
    b.setAttribute("aria-pressed", String(on)); tile.classList.toggle("is-on", on);
    b.querySelector(".odl-state").textContent = on ? (slider && b.dataset.on.endsWith("%") ? slider.value + "%" : b.dataset.on) : b.dataset.off;
    tally();
  }));
  root.querySelectorAll(".odl-slider input").forEach((s) => s.addEventListener("input", () => {
    s.style.setProperty("--v", ((s.value - s.min) / (s.max - s.min)) * 100 + "%");
    const b = s.closest(".odl-tile").querySelector(".odl-toggle");
    if (b.dataset.on.endsWith("%")) { b.dataset.on = s.value + "%"; if (b.getAttribute("aria-pressed") === "true") b.querySelector(".odl-state").textContent = s.value + "%"; }
  }));
  const steps = root.querySelector(".odl-steps"), dial = root.querySelector(".odl-dial"), temp = root.querySelector(".odl-temp");
  const min = Number(steps.dataset.min), max = Number(steps.dataset.max), [down, up] = steps.querySelectorAll("button");
  const fmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
  const set = (v) => { temp.textContent = fmt(v); dial.style.setProperty("--t", ((v - min) / (max - min)) * 100);
    down.disabled = v <= min; up.disabled = v >= max; down.setAttribute("aria-label", `Lower to ${fmt(v - 0.5)}°`); up.setAttribute("aria-label", `Raise to ${fmt(v + 0.5)}°`); };
  [down, up].forEach((b) => b.addEventListener("click", () => set(Math.min(max, Math.max(min, Number(temp.textContent) + Number(b.dataset.d))))));
  set(Number(temp.textContent));
});
</script>
