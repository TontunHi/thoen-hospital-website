<section class="odl-sign-in-form" aria-labelledby="odl-sif-title">
  <div class="odl-head">

      <div class="odl-control"><input id="odl-sif-email" type="email" autocomplete="username" value="jonas.ekdahl@oskarby.example" required></div>
    </div>
    <div class="odl-field is-invalid">
      <div class="odl-label-row"><label for="odl-sif-pass">Password</label><a href="#odl-sif-title">Forgot password?</a></div>
      <div class="odl-control"><input id="odl-sif-pass" type="password" autocomplete="current-password" value="winter-ledger-26" aria-invalid="true" aria-describedby="odl-sif-err" required>
        <button type="button" class="odl-reveal" aria-pressed="false" aria-controls="odl-sif-pass"><svg class="odl-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg><svg class="odl-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg><span>Show</span></button></div>
      <p class="odl-error" id="odl-sif-err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>That password does not match this email. 2 tries left before a 15-minute pause.</span></p>
    </div>
    <label class="odl-check"><input type="checkbox" checked><span>Remember this device <small>for 30 days</small></span></label>

  <div class="odl-divider" role="separator">or</div>

<script>
document.querySelectorAll(".odl-sign-in-form").forEach((root) => {
  if (root.dataset.odlReady) return; root.dataset.odlReady = "1";
  const btn = root.querySelector(".odl-reveal"), input = root.querySelector('input[autocomplete="current-password"]'), label = btn.querySelector("span");
  btn.addEventListener("click", () => {
    const show = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(show)); input.type = show ? "text" : "password"; label.textContent = show ? "Hide" : "Show";
  });
  root.querySelector("form").addEventListener("submit", (e) => e.preventDefault());
});
</script>
